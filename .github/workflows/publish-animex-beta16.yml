name: Publish ANIMEX 1.0.6 Beta16 online update
'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-animex-beta16.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve tested CI NRO and verify original bytes
        env:
          SOURCE_ARCHIVE_URL: 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-b5fc-8209-a416-4903944ed51f/raw?se=2026-10-11T02%3A39%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=a88ecf5c-10d9-5a4b-9f91-437e7b881a4e&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T23%3A46%3A03Z&ske=2026-10-11T23%3A46%3A03Z&sks=b&skv=2026-02-06&sig=3y0plgk5i6AlAvNNX660/V5AZWsxCsORFRzkgJEhgQw%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 "$SOURCE_ARCHIVE_URL" -o /tmp/ANIMEX-beta16-ci.zip
          unzip -j /tmp/ANIMEX-beta16-ci.zip 'ANIMEX-1.0.6-beta.16.nro'
          echo '2fa9d1d30b3c60f24d80ae11f4f72dca5d59a2af56b44b9eedb63594141050ea  ANIMEX-1.0.6-beta.16.nro' | sha256sum -c -
          test -s 'ANIMEX-1.0.6-beta.16.nro'
      - name: Publish tested release asset first
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view '1.0.6-beta.16' --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload '1.0.6-beta.16' 'ANIMEX-1.0.6-beta.16.nro' --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create '1.0.6-beta.16' 'ANIMEX-1.0.6-beta.16.nro' --repo "$GITHUB_REPOSITORY" --title 'ANIMEX 1.0.6-beta.16' --notes 'Beta16 test: Korea SK KANJU direct movie HLS manual seek packetless 1650ms handoff improved to 350ms, target-video-data no-frame recovery. China Mobile/Telecom and other provider profiles unchanged. Needs real Switch field validation.' --prerelease --latest=false
          fi
          gh release view '1.0.6-beta.16' --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq 'ANIMEX-1.0.6-beta.16.nro'
      - name: Advance only the Beta update manifest after NRO confirmed
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path("beta.json")
          rows=json.loads(path.read_text(encoding="utf-8"))
          assert isinstance(rows,list)
          new={
            "version":"1.0.6-beta.16",
            "channel":"beta",
            "download_url":"https://github.com/cuijunhao20000307-web/-ANIMEX-Release/releases/download/1.0.6-beta.16/ANIMEX-1.0.6-beta.16.nro",
            "download_url_cn":"",
            "download_url_backup":"",
            "notes":"SK电影端快进无分片等待优化、目标帧卡死恢复保护；保留国内运营商优化（Beta16测试）",
            "sha256":"2fa9d1d30b3c60f24d80ae11f4f72dca5d59a2af56b44b9eedb63594141050ea"
          }
          path.write_text(json.dumps([new]+[r for r in rows if r.get("version")!="1.0.6-beta.16"],ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add beta.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update ANIMEX Beta manifest 1.0.6-beta.16'
            git push origin HEAD:main
          fi
