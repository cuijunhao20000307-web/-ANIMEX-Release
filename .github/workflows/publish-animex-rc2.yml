name: Publish ANIMEX 1.0.6 RC2 to beta
'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-animex-rc2.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified Switch NRO artifact
        env:
          SOURCE_ARCHIVE_URL: 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-9af0-8209-abad-201b0f023992/raw?se=2026-10-11T12%3A19%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=e39d8900-fb81-526f-bf40-98bfb8462e99&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T01%3A04%3A16Z&ske=2026-10-12T01%3A04%3A16Z&sks=b&skv=2026-02-06&sig=Oq0VUz5wIWFBWO0ThS%2BAm9PL/99WhBKvBe/HUmZgJOQ%3D'
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 15 --max-time 180 "$SOURCE_ARCHIVE_URL" -o /tmp/animex-rc2.zip
          unzip -j /tmp/animex-rc2.zip 'ANIMEX-1.0.6-RC2.nro'
          echo '29a92370c67e36fbb5b5a31078a6b7b9c6eba67266a73aa287da6ac44ed01b66  ANIMEX-1.0.6-RC2.nro' | sha256sum -c -
          test -s 'ANIMEX-1.0.6-RC2.nro'
      - name: Create RC2 prerelease with verified NRO
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > /tmp/rc2-notes.txt <<'NOTES'
          ANIMEX 1.0.6-RC2 - release candidate in the Beta update channel
          - Same enlarged translucent grey/white in-player loading ring across anime, TV, movie and adult video ports
          - Fix RC1 movie buffering jitter: draw ring from a cached frozen frame instead of repeating full-frame scaling
          - Correct prerelease sorting: RC2 > RC1 > beta18. New RC builds default to Beta channel.
          - Preserve initial video-open loader, existing Korean SK/LGU+ and China Mobile/Telecom paths, and stable 1.0.5
          - Real hardware carrier tests remain necessary before final promotion
          NOTES
          if gh release view '1.0.6-RC2' --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload '1.0.6-RC2' 'ANIMEX-1.0.6-RC2.nro' --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create '1.0.6-RC2' 'ANIMEX-1.0.6-RC2.nro' --repo "$GITHUB_REPOSITORY" --title 'ANIMEX 1.0.6-RC2' --notes-file /tmp/rc2-notes.txt --prerelease --latest=false
          fi
          gh release view '1.0.6-RC2' --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq 'ANIMEX-1.0.6-RC2.nro'
      - name: Put RC2 first and alone in legacy compatible Beta feed
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('beta.json')
          old=json.loads(p.read_text(encoding='utf-8'))
          assert isinstance(old,list) and len(old)>=1
          assert old[0].get('version') in ('1.0.6-RC1','1.0.6-RC2')
          new={
            "version":"1.0.6-RC2",
            "channel":"beta",
            "download_url":"https://github.com/cuijunhao20000307-web/-ANIMEX-Release/releases/download/1.0.6-RC2/ANIMEX-1.0.6-RC2.nro",
            "download_url_cn":"",
            "download_url_backup":"",
            "notes":"RC2：四端视频内半透明灰白色大缓冲圈，复用冻结画面降低卡顿；RC优先于Beta更新排序；保持国内SK/LGU+及国内移动电信优化。",
            "sha256":"29a92370c67e36fbb5b5a31078a6b7b9c6eba67266a73aa287da6ac44ed01b66"
          }
          p.write_text(json.dumps([new],ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add beta.json
          if ! git diff --cached --quiet; then
            git commit -m 'Advance beta channel to ANIMEX 1.0.6-RC2'
            git push origin HEAD:main
          fi
