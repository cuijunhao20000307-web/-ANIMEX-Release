name: Publish ANIMEX 1.0.6 RC3 Beta Update
'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-animex-rc3.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify Switch release binary
        env:
          SOURCE_ARCHIVE_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-170c-8206-b0ad-01f0b9f21a4f/raw?se=2026-10-11T12%3A44%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=9c03651c-b4e5-5cf5-bd4d-b4d43da19759&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T23%3A22%3A49Z&ske=2026-10-11T23%3A22%3A49Z&sks=b&skv=2026-02-06&sig=5o%2B73Cx2BI3wEAWSm89ZNz0tXgdWcv7z0BHnLj9DmtI%3D'
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 15 --max-time 180 "$SOURCE_ARCHIVE_URL" -o /tmp/rc3-artifact.zip
          unzip -j /tmp/rc3-artifact.zip 'ANIMEX-1.0.6-RC3.nro'
          echo '87d972d945ff1c8b053b9f3061609d1a55e8292d6a3a44078ce4981a914a83f7  ANIMEX-1.0.6-RC3.nro' | sha256sum -c -
          test -s 'ANIMEX-1.0.6-RC3.nro'
      - name: Create prerelease and upload NRO
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > /tmp/notes.txt <<'NOTES'
          ANIMEX 1.0.6-RC3 (Beta / release candidate)
          Four-port common buffering UI: start timing immediately on seek or mid-video rebuffer; show the 72px translucent grey/white ring only when the same wait reaches 2 seconds. No spinner for waits under 2 seconds.
          Repair in-seek prebuffer animation and release stale frozen framebuffer after wait/recovery. Preserve initial opening loader and pre-existing regional network/HLS seek policies (China Mobile/Telecom, Korean SK and LGU+).
          Numeric Beta/RC/stable update ordering from RC2 retained. Stable 1.0.5 remains separate. Real hardware testing still required.
          NOTES
          if gh release view '1.0.6-RC3' --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload '1.0.6-RC3' 'ANIMEX-1.0.6-RC3.nro' --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create '1.0.6-RC3' 'ANIMEX-1.0.6-RC3.nro' --repo "$GITHUB_REPOSITORY" --title 'ANIMEX 1.0.6-RC3' --notes-file /tmp/notes.txt --prerelease --latest=false
          fi
          gh release view '1.0.6-RC3' --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq 'ANIMEX-1.0.6-RC3.nro'
      - name: Update beta test channel after verified release
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('beta.json')
          old=json.loads(p.read_text(encoding='utf-8'))
          assert isinstance(old,list) and old and old[0].get('version') in ('1.0.6-RC2','1.0.6-RC3')
          latest={
            'version':'1.0.6-RC3',
            'channel':'beta',
            'download_url':'https://github.com/cuijunhao20000307-web/-ANIMEX-Release/releases/download/1.0.6-RC3/ANIMEX-1.0.6-RC3.nro',
            'download_url_cn':'',
            'download_url_backup':'',
            'notes':'RC3：四端视频内快进/缓冲即刻计时，等待不足2秒不显示圆形缓冲动画；超过2秒采用原半透明灰白色大圆圈；清理冻结画面缓存；保留所有地区网络优化。',
            'sha256':'87d972d945ff1c8b053b9f3061609d1a55e8292d6a3a44078ce4981a914a83f7'
          }
          p.write_text(json.dumps([latest],ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add beta.json
          if ! git diff --cached --quiet; then
            git commit -m 'Advance ANIMEX Beta to 1.0.6-RC3'
            git push origin HEAD:main
          fi
