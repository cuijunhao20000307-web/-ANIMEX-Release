name: Publish ANIMEX 1.0.6 Beta18 online update
'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-animex-beta18.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve verified Beta18 CI artifact
        env:
          SOURCE_ARCHIVE_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-9f70-8206-b925-93416e52a64c/raw?se=2026-10-11T04%3A04%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=d1e73b95-7b88-5e5f-8c78-bbd7ff1dd091&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T00%3A04%3A00Z&ske=2026-10-12T00%3A04%3A00Z&sks=b&skv=2026-02-06&sig=YPPi8cyOcFeJQ0Tp7FVMS%2BOurRdgqrxVI9xtFS9kajY%3D'
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 15 --max-time 180 "$SOURCE_ARCHIVE_URL" -o /tmp/ANIMEX-beta18-ci.zip
          unzip -j /tmp/ANIMEX-beta18-ci.zip 'ANIMEX-1.0.6-beta.18.nro'
          echo '895037b31ad47355cdbdcc7a940727353fd4f47806eb7b2a373b769de41b1a24  ANIMEX-1.0.6-beta.18.nro' | sha256sum -c -
          test -s 'ANIMEX-1.0.6-beta.18.nro'
      - name: Upload verified asset as Beta prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view '1.0.6-beta.18' --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload '1.0.6-beta.18' 'ANIMEX-1.0.6-beta.18.nro' --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create '1.0.6-beta.18' 'ANIMEX-1.0.6-beta.18.nro' --repo "$GITHUB_REPOSITORY" --title 'ANIMEX 1.0.6-beta.18' --notes 'Beta18 test: KANJU movie title alias search for 怪癖女的单人餐 / 乖僻女的单人餐 / 孤僻女的一人饭, and post-failure SK HLS large-seek alternate global-time retry. Does not alter anime, China carrier policies or stable channel. Live CDN behavior needs validation.' --prerelease --latest=false
          fi
          gh release view '1.0.6-beta.18' --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq 'ANIMEX-1.0.6-beta.18.nro'
      - name: Advance only Beta manifest after asset upload
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("beta.json")
          old=json.loads(p.read_text(encoding="utf-8"))
          assert isinstance(old,list)
          new={
            "version":"1.0.6-beta.18",
            "channel":"beta",
            "download_url":"https://github.com/cuijunhao20000307-web/-ANIMEX-Release/releases/download/1.0.6-beta.18/ANIMEX-1.0.6-beta.18.nro",
            "download_url_cn":"",
            "download_url_backup":"",
            "notes":"电影端搜索别名匹配修复（怪癖女/乖僻女）及SK大幅快进异常分片备用定位；国内网络配置不变（Beta18测试）",
            "sha256":"895037b31ad47355cdbdcc7a940727353fd4f47806eb7b2a373b769de41b1a24"
          }
          p.write_text(json.dumps([new]+[x for x in old if x.get("version")!="1.0.6-beta.18"],ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add beta.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update ANIMEX Beta manifest 1.0.6-beta.18'
            git push origin HEAD:main
          fi
