name: Publish ANIMEX 1.0.6 Beta17 online update
'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-animex-beta17.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve the tested NRO and verify its exact hash
        env:
          SOURCE_ARCHIVE_URL: 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-9d3c-8209-86bc-0261f75c817d/raw?se=2026-10-11T03%3A22%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=96172b72-cd84-577c-95dd-470d175d9f90&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T23%3A18%3A25Z&ske=2026-10-11T23%3A18%3A25Z&sks=b&skv=2026-02-06&sig=w9PAM1ktw593PX9QJ%2Bc/ldWPv76ma2BBqf2bi9nPdYw%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 "$SOURCE_ARCHIVE_URL" -o /tmp/ANIMEX-beta17-ci.zip
          unzip -j /tmp/ANIMEX-beta17-ci.zip 'ANIMEX-1.0.6-beta.17.nro'
          echo 'c7935a54ec04883402ddb1fa6a0fbc254f14097498d01552634b86f6acf37ae9  ANIMEX-1.0.6-beta.17.nro' | sha256sum -c -
          test -s 'ANIMEX-1.0.6-beta.17.nro'
      - name: Upload verified NRO to public GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view '1.0.6-beta.17' --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload '1.0.6-beta.17' 'ANIMEX-1.0.6-beta.17.nro' --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create '1.0.6-beta.17' 'ANIMEX-1.0.6-beta.17.nro' --repo "$GITHUB_REPOSITORY" --title 'ANIMEX 1.0.6-beta.17' --notes 'Korea SK movie HLS beta17: fix seek target frame starvation when packets leave demux queue, improve direct bookmarked resume with safe fallback; retain China Telecom/Mobile, other carrier/network and stable channel. Hardware performance still needs testing.' --prerelease --latest=false
          fi
          gh release view '1.0.6-beta.17' --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq 'ANIMEX-1.0.6-beta.17.nro'
      - name: Update beta channel only after asset upload succeeded
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("beta.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          assert isinstance(data,list) and data
          new={
            "version":"1.0.6-beta.17",
            "channel":"beta",
            "download_url":"https://github.com/cuijunhao20000307-web/-ANIMEX-Release/releases/download/1.0.6-beta.17/ANIMEX-1.0.6-beta.17.nro",
            "download_url_cn":"",
            "download_url_backup":"",
            "notes":"SK电影端大幅快进目标帧卡死判断修复、断点续播直接定位并保留旧方案；国内网络配置不变（测试版）",
            "sha256":"c7935a54ec04883402ddb1fa6a0fbc254f14097498d01552634b86f6acf37ae9"
          }
          p.write_text(json.dumps([new]+[x for x in data if x.get("version")!="1.0.6-beta.17"],ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add beta.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update ANIMEX beta manifest to 1.0.6-beta.17'
            git push origin HEAD:main
          fi
