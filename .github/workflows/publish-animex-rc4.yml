name: Publish ANIMEX 1.0.6 RC4 Beta
'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-animex-rc4.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and SHA256 verify RC4 CI NRO
        env:
          SOURCE_ARCHIVE_URL: 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-7cb0-8209-a09b-a912f2a05334/raw?se=2026-10-11T13%3A48%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=c107870c-29e0-513f-9cdb-67707a097f3d&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T23%3A46%3A03Z&ske=2026-10-11T23%3A46%3A03Z&sks=b&skv=2026-02-06&sig=rrW2/5w5%2Bd8Xb2/Nt257slgPCIo2XeGaMT/axPw69UE%3D'
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 15 --max-time 150 "$SOURCE_ARCHIVE_URL" -o /tmp/animex-rc4.zip
          unzip -j /tmp/animex-rc4.zip 'ANIMEX-1.0.6-RC4.nro'
          echo '7e9021262f91ade4bf971853983e3167bbebdcecf95b5953b2079ae958643dec  ANIMEX-1.0.6-RC4.nro' | sha256sum -c -
          test -s 'ANIMEX-1.0.6-RC4.nro'
      - name: Upload RC4 official prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > /tmp/notes.txt <<'NOTES'
          ANIMEX 1.0.6-RC4 - Release Candidate via Beta channel

          - Movie/film smoothness: avoid premature audio pause when software decoder is still delivering video frames; preserve protection for genuinely stalled video.
          - Correct pause/touch-scrub/active-seek from entering the normal playback rebuffer watchdog.
          - Add movie-only anonymized markers before long HLS reader stop, audio holds, video packet starvation and recovery; don't race/detach FFmpeg on pathological CDNs.
          - Mainland direct anime HLS faster first-picture handoff with real keyframe, video, and audio data for China Mobile, Telecom, and Unicom profiles, including Heilongjiang.
          - RC3 four streaming ports 2-second delayed translucent ring, China network refill and Korean SK/LGU+ seek/connection paths preserved.
          - Full host regressions & Switch CI passed. Real device/CDN performance still requires verification.

          This release is for the Beta channel; stable 1.0.5 remains unchanged.
          NOTES
          if gh release view '1.0.6-RC4' --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload '1.0.6-RC4' 'ANIMEX-1.0.6-RC4.nro' --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create '1.0.6-RC4' 'ANIMEX-1.0.6-RC4.nro' --repo "$GITHUB_REPOSITORY" --title 'ANIMEX 1.0.6-RC4' --notes-file /tmp/notes.txt --prerelease --latest=false
          fi
          gh release view '1.0.6-RC4' --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq 'ANIMEX-1.0.6-RC4.nro'
      - name: Update only current Beta test feed after validated release
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("beta.json")
          old=json.loads(p.read_text(encoding="utf-8"))
          assert isinstance(old,list) and old and old[0].get("version") in ("1.0.6-RC3","1.0.6-RC4")
          new={
            "version":"1.0.6-RC4",
            "channel":"beta",
            "download_url":"https://github.com/cuijunhao20000307-web/-ANIMEX-Release/releases/download/1.0.6-RC4/ANIMEX-1.0.6-RC4.nro",
            "download_url_cn":"",
            "download_url_backup":"",
            "notes":"RC4：电影端音画同步卡顿保护、暂停和快进状态误判修复；黑龙江移动/电信/联通动漫首帧读取优化；保留RC3四端2秒缓冲圈及韩国网络优化。",
            "sha256":"7e9021262f91ade4bf971853983e3167bbebdcecf95b5953b2079ae958643dec"
          }
          p.write_text(json.dumps([new],ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add beta.json
          if ! git diff --cached --quiet; then
            git commit -m 'Advance Beta test channel to ANIMEX 1.0.6-RC4'
            git push origin HEAD:main
          fi
